# Maps the secret ids the workflow requests with runtime.getSecrets() to the env vars holding them.
# In a Confidential Workflow the Vault DON releases these straight into the attested enclave; they
# are never in plaintext on Workflow DON nodes. In simulation they come from .env / the shell.
secretsNames:
  BRANCH_SEAL_ROOT:
    - SECRET_BRANCH_SEAL_ROOT
  REVEAL_SECRET:
    - SECRET_REVEAL_SECRET
